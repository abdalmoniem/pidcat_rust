[package]
edition = "2024"
name = "pidcatrs"
version = "2.0.0"
readme = "README.md"
build = "build/build.rs"
license-file = "LICENSE.md"
homepage = "https://github.com/abdalmoniem/pidcatrs"
license = "GPL-2.0-or-later WITH Bison-exception-2.2"
repository = "https://github.com/abdalmoniem/pidcatrs"
keywords = ["adb","log","logcat","android","pidcatrs"]
authors = ["AbdElMoniem ElHifnawy <hifnawy_moniem@hotmail.com>"]
description = "A colorized Android logcat viewer with advanced filtering capabilities."
categories = ["parsing", "development-tools", "command-line-interface", "command-line-utilities"]

[workspace]
members = [
  ".",
  "build/xshell",
  "build/xtask",
]

[dependencies]
ctrlc = "3.5.2"
regex = "1.12.3"
colored = "3.1.1"
ratatui = "0.30.2"
futures = "0.3.31"
etcetera = "0.11.0"
itertools = "0.14.0"
lazy_static = "1.5.0"
is-terminal = "0.4.17"
terminal_size = "0.4.3"
clap_complete = "4.5.66"
scope-functions = "1.1.0"
strip-ansi-escapes = "0.2.1"
terminal-clipboard = "0.4.1"
clap = { version = "4.5.60", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = { version = "1.1.6", features = ["preserve_order"] }
crossterm = { version = "0.29", features = ["event-stream"] }
schemars = { version = "1.2.2", features = ["preserve_order"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
tui-file-explorer = { version = "2.3.0", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
tokio = { version = "1.48.0", features = ["rt-multi-thread", "io-util", "io-std", "fs", "process", "sync", "macros", "time"] }

[build-dependencies]
build-print = "1.0.1"
embed-resource = "3.0.6"
scope-functions = "1.1.0"

[[bin]]
name = "pidcatrs"
path = "src/bin/main.rs"

[dev-dependencies]
build-print = "1.0.1"

[profile.release]
debug = false
strip = false
